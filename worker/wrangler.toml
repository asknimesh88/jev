name = "jev-watcher"
main = "index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
WATCHLIST = "BTCUSDT,SOLUSDT,ETHUSDT,KASUSDT,ALGOUSDT,HBARUSDT,QNTUSDT,ONDOUSDT,XLMUSDT,XDCUSDT,XRPUSDT"

# 1) npx wrangler kv namespace create STATE   → paste the id below
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

# 2) Secrets (npx wrangler secret put <NAME> --config worker/wrangler.toml):
#    TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, JEV_API_KEY (optional: ANTHROPIC_API_KEY)
