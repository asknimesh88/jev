name = "jev-watcher"
main = "index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
WATCHLIST = "BTCUSDT,ETHUSDT,SOLUSDT"

# 1) npx wrangler kv namespace create STATE   → paste the id below
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

# 2) Secrets (npx wrangler secret put <NAME> --config worker/wrangler.toml):
#    TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, COMPOSIO_API_KEY, JEV_CONNECTED_ACCOUNT_ID (optional: ANTHROPIC_API_KEY)
